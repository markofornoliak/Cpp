name: Validate and deploy Learn C++

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript, lint, and product tests
        run: npm run check
      - name: Restore pinned compiler assets
        uses: actions/cache@v5
        with:
          path: public/runtime/bin
          key: cpp-runtime-${{ hashFiles('public/runtime/manifest.json', 'package-lock.json') }}
      - name: Build production site and verify runtime integrity
        run: npm run build
      - name: Execute reference solutions and lesson examples with real Clang
        run: npm run test:runtime
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
